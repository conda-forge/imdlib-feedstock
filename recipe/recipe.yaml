context:
  version: "0.2.0"
package:
  name: imdlib
  version: ${{ version }}
source:
  url: https://pypi.org/packages/source/i/imdlib/imdlib-${{ version }}.tar.gz
  sha256: 9c3c81980f7613daeeda2124ae68ca6684028840551570351715d061ea4af7ea
build:
  noarch: python
  number: 0
  script: python -m pip install . --no-deps --no-build-isolation -vv
requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - matplotlib-base
    - numpy
    - pandas >=2.2
    - six
    - python-dateutil
    - pytz
    - urllib3
    - scipy
    - xarray
    - requests
tests:
  - python:
      imports:
        - imdlib
        - imdlib.core
        - imdlib.compute
        - imdlib.drought
        - imdlib.extreme
        - imdlib.real
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - script: python test_installed.py
    files:
      recipe:
        - test_installed.py
    requirements:
      run:
        - python ${{ python_min }}.*
  - script: python test_installed.py
    files:
      recipe:
        - test_installed.py
    requirements:
      run:
        - python
about:
  homepage: https://github.com/iamsaswata/imdlib
  summary: Download and process IMD gridded meteorological data over India
  description: |
    IMDLIB retrieves and processes India Meteorological Department gridded
    rainfall and temperature data, including climate indices, drought indices,
    and extreme temperature event assessments.
  license: MIT
  license_file: LICENSE
  documentation: https://imdlib.readthedocs.io/
  repository: https://github.com/iamsaswata/imdlib
extra:
  recipe-maintainers:
    - iamsaswata
